# Wispjar 配置示例。复制为 config.yaml 后按需修改。
# 敏感项建议用环境变量注入（优先级高于本文件）：
#   WISPJAR_MASTER_KEY / WISPJAR_JWT_SECRET / WISPJAR_ADMIN_PASSWORD / WISPJAR_SANDBOX_KEY
# 另支持 WISPJAR_ADDR 覆盖 server.addr。

server:
  addr: ":8080"
  # 额外允许的跨域 Origin（WS /api/ws 握手校验；同源请求始终放行，无需列出）。
  # 前后端分离部署（如前端单独域名）时在此添加前端完整来源：
  # allowed_origins: ["https://wispjar-ui.example.com"]
  allowed_origins: []

database:
  # MySQL 8；charset/parseTime/time_zone=+08:00 等参数由程序自动补全
  dsn: "wispjar:wispjar@tcp(127.0.0.1:3306)/wispjar"

auth:
  # HS256 密钥；留空则启动时随机生成（重启后旧 token 全部失效）
  jwt_secret: ""
  token_ttl: 24h

crypto:
  # 32 字节主密钥，base64 或 hex 编码；用于供应商密钥 AES-256-GCM 加密
  master_key: ""

storage:
  data_dir: "./data"
  downloads:
    # 单文件及目录 ZIP 上限 20 GiB；源内容和压缩包各自受此限制。
    max_bytes: 21474836480
    # 本实例下载暂存总配额 40 GiB；使用 data_dir 下的 .downloads。
    max_staged_bytes: 42949672960
    max_entries: 100000
    ttl: 30m
    prepare_timeout: 30m
  volumes:
    backend: "docker"
    namespace: "main"
    # 必须包含 volume_id；可用 namespace/kind/volume_id/org_id/user_id。
    # 首次创建后卷名落库固定，修改此配置只影响新卷。
    name_pattern: "wj-{namespace}-{kind}-{volume_id}"
    # 部署管理员配置；空值禁用持久卷创建，不回退成临时存储。
    # Linux 本地 Docker 可使用 unix:///var/run/docker.sock。
    # Windows 可配置受保护的 Docker HTTP(S) 端点；不支持 named pipe。
    docker_endpoint: ""

runtime:
  # 单个主 turn 同时运行的 subagent 上限，范围 1..32。
  max_parallel_tasks: 4

sandbox:
  # 每次启动只启用一个后端；当前仅实现 opensandbox。修改后重启生效。
  # 省略此项时默认 opensandbox，兼容旧配置。
  backend: "opensandbox"

opensandbox:
  lifecycle_url: "http://127.0.0.1:8081"
  api_key: ""
  # true：execd/egress 流量经 opensandbox-server 反代（客户端只需连通 server 端口，
  # 适用于 wispjar 以 bridge 网络部署）；false：直连沙箱在宿主发布的端口（host 网络部署用）
  use_server_proxy: false
