version: 2

builds:
  - id: wispjar
    main: ./cmd/wispjar
    binary: wispjar
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    env: [CGO_ENABLED=0]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

dockers_v2:
  - id: wispjar
    ids: [wispjar]
    dockerfile: Dockerfile.release
    images: [ghcr.io/ravenmk2/wispjar]
    tags: ["{{ .Version }}", latest]
    platforms: [linux/amd64, linux/arm64]
    labels:
      org.opencontainers.image.source: https://github.com/ravenmk2/wispjar

  # Keep the existing architecture-specific tags for clients that pin them.
  - id: wispjar-amd64
    ids: [wispjar]
    dockerfile: Dockerfile.release
    images: [ghcr.io/ravenmk2/wispjar]
    tags: ["{{ .Version }}-amd64"]
    platforms: [linux/amd64]
    labels:
      org.opencontainers.image.source: https://github.com/ravenmk2/wispjar
  - id: wispjar-arm64
    ids: [wispjar]
    dockerfile: Dockerfile.release
    images: [ghcr.io/ravenmk2/wispjar]
    tags: ["{{ .Version }}-arm64"]
    platforms: [linux/arm64]
    labels:
      org.opencontainers.image.source: https://github.com/ravenmk2/wispjar

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^style:"
      - "^build:"
      - "Merge pull request"
  groups:
    - title: Features
      regexp: "^feat(\\(.+\\))?:.*$"
      order: 0
    - title: Bug Fixes
      regexp: "^fix(\\(.+\\))?:.*$"
      order: 1
