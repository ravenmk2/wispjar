version: 2

builds:
  - id: wispjar
    main: ./cmd/wispjar
    binary: wispjar
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    env: [CGO_ENABLED=0]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

dockers:
  - id: wispjar-amd64
    goarch: amd64
    use: buildx
    dockerfile: Dockerfile
    image_templates:
      - ghcr.io/ravenmk2/wispjar:{{ .Version }}-amd64
    build_flag_templates:
      - --platform=linux/amd64
      - --label=org.opencontainers.image.source=https://github.com/ravenmk2/wispjar
  - id: wispjar-arm64
    goarch: arm64
    use: buildx
    dockerfile: Dockerfile
    image_templates:
      - ghcr.io/ravenmk2/wispjar:{{ .Version }}-arm64
    build_flag_templates:
      - --platform=linux/arm64
      - --label=org.opencontainers.image.source=https://github.com/ravenmk2/wispjar

docker_manifests:
  - name_template: ghcr.io/ravenmk2/wispjar:{{ .Version }}
    image_templates:
      - ghcr.io/ravenmk2/wispjar:{{ .Version }}-amd64
      - ghcr.io/ravenmk2/wispjar:{{ .Version }}-arm64
  - name_template: ghcr.io/ravenmk2/wispjar:latest
    image_templates:
      - ghcr.io/ravenmk2/wispjar:{{ .Version }}-amd64
      - ghcr.io/ravenmk2/wispjar:{{ .Version }}-arm64

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^style:"
      - "^build:"
      - "Merge pull request"
  groups:
    - title: Features
      regexp: "^feat(\\(.+\\))?:.*$"
      order: 0
    - title: Bug Fixes
      regexp: "^fix(\\(.+\\))?:.*$"
      order: 1
