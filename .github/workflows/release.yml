name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write # push to GHCR

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Once the frontend build is wired up, add Node.js setup and the web/dist
      # build steps here; for now dist is only a placeholder embedded into the binary
      - name: Ensure web/dist placeholder
        shell: bash
        run: mkdir -p web/dist && touch web/dist/index.html

      - uses: docker/setup-qemu-action@v4 # register binfmt for arm64 image builds
      - uses: docker/setup-buildx-action@v4 # required by dockers' use: buildx

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
