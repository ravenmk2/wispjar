name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write # push to GHCR

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Build the real frontend: the binary embeds web/dist via go:embed,
      # so release artifacts must ship the actual UI, not a placeholder
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build web frontend
        shell: bash
        working-directory: web
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --frozen-lockfile
          pnpm build

      - uses: docker/setup-qemu-action@v4 # register binfmt for arm64 image builds
      - uses: docker/setup-buildx-action@v4 # required by dockers_v2

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
