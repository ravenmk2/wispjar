  </g>

  <!-- Four-point sparkles. -->
  <path d="M391 208 C396 235 403 243 432 250 C403 257 396 265 391 292 C386 265 379 257 350 250 C379 243 386 235 391 208Z" fill="#10A8BA"/>
  <path d="M406 301 C409 316 414 322 430 326 C414 330 409 336 406 351 C403 336 398 330 382 326 C398 322 403 316 406 301Z" fill="#10A8BA"/>

  <!-- Rounded shoulders and broad base; the complete silhouette is almost square. -->
  <path d="M104 106
    C125 110 127 129 108 140
    C70 160 47 184 47 223
    V395
    C47 440 75 464 127 464
    H385
    C437 464 465 440 465 395
    V223
    C465 184 442 160 404 140
    C385 129 387 110 408 106"
    stroke="#12384A" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Lid with softly bowed top and lower rim. -->
