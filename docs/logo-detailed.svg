    C100 69 108 64 124 61
    C185 49 327 49 388 61
    C404 64 412 69 412 80
    V98
    C412 106 407 109 395 110
    C329 117 183 117 117 110
    C105 109 100 106 100 98Z"
    stroke="#12384A" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M128 83 C203 87 309 87 384 83" stroke="#12384A" stroke-width="8" stroke-linecap="round"/>
  <path d="M96 107 C169 119 343 119 416 107" stroke="#12384A" stroke-width="11" stroke-linecap="round"/>
  <path d="M139 136 C191 142 321 142 373 136" stroke="#12384A" stroke-width="6.5" stroke-linecap="round"/>

  <!-- Reflections echo the rounded glass without filling the transparent jar. -->
