<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Wispjar — refined wisp and jar</title>
  <desc id="description">Refined turquoise wisp and bright balanced stars behind the lighter lines of a wide deep-blue jar with a lower lid and thin neck detail. Transparent background.</desc>
  <defs>
    <linearGradient id="wisp-fill" x1="670" y1="720" x2="910" y2="1100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#94E1E4"/>
      <stop offset="1" stop-color="#7ED3DA"/>
    </linearGradient>
    <linearGradient id="glass-highlight" x1="72" y1="376" x2="136" y2="435" gradientUnits="userSpaceOnUse">
      <stop stop-color="#CBD7DF"/>
      <stop offset="1" stop-color="#9CAEBB"/>
    </linearGradient>
  </defs>

  <!-- The enlarged spirit sits behind the glass and mouth lines. -->
  <!-- Broad, continuous curves preserve the reference wisp's rising motion. -->
  <g transform="translate(-246 -227) scale(.614 .58)">
    <path d="M898 595
      C865 594 842 613 835 637
      C828 661 840 672 852 684
      C869 701 871 715 858 732
