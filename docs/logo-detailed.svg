      C881 699 886 718 873 738
      C857 760 831 766 791 766
      C709 762 646 801 619 870
      C594 934 614 1015 663 1060
      C697 1092 742 1110 801 1102
      C850 1098 903 1074 940 1039
      C921 1048 900 1057 884 1062
      Q878 1064 883 1059
      C911 1031 933 998 931 966
      C936 926 923 895 901 868
      C881 844 870 828 880 802
      C890 776 914 767 920 748
      C933 716 916 691 892 672
      C870 656 858 638 865 620
